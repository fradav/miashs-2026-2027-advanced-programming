project:
  type: book
  output-dir: docs

lang: fr

book:
  title: "Programmation avancée et calcul parallèle"
  subtitle: "M2 MIASHS — apprentissage autonome avec ou sans tuteur IA"
  author:
    - name: François-David Collin
      email: francois-david.collin@umontpellier.fr
      affiliations:
        - CNRS
        - IMAG
  date: "2026-08-25"
  date-format: full
  page-footer:
    left: Sous licence <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/">CC BY-NC-SA 4.0</a>.
    right: Construit avec <a href="https://quarto.org/">Quarto</a>.
  chapters:
    - index.qmd
    - intro.qmd
    - dispositif.qmd
    - tuteur-ia.qmd
    - plan-apprentissage.qmd
    - Courses/00_intro-parallele.qmd
    - Courses/01_asynchrone.qmd
    - Courses/02_ipc-verrous.qmd
    - Courses/03_distribue.qmd
    - Courses/04_simd.qmd
    - Courses/05_gpu.qmd
    - Courses/06_webgpu.qmd
    - projets.qmd
    - summary.qmd
    - references.qmd

bibliography: references.bib
csl: ieee.csl

fig-cap-location: top

execute:
  freeze: auto
  cache: true

theme:
  dark: [darkly, styles.scss]
  light: [flatly, styles.scss]

format:
  html:
    number-depth: 3
    toc-depth: 4
    html-math-method: katex
    respect-user-color-scheme: true
