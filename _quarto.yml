project:
  type: book
  output-dir: docs
  resources:
    - slides/
    - downloads/

lang: en

book:
  title: "Advanced Programming and Parallel Computing"
  subtitle: "M2 MIASHS — self-directed learning with or without an AI tutor"
  author:
    - name: François-David Collin
      email: francois-david.collin@umontpellier.fr
      affiliations:
        - CNRS
        - IMAG
  date: "2026-08-25"
  date-format: full
  page-footer:
    left: Licensed under <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/">CC BY-NC-SA 4.0</a>.
    right: Built with <a href="https://quarto.org/">Quarto</a>.
  chapters:
    - index.qmd
    - prerequisites.qmd
    - teaching-design.qmd
    - ai-tutor.qmd
    - learning-plan.qmd
    - Courses/00_intro-parallelism.qmd
    - Courses/01_asynchronous.qmd
    - Courses/02_ipc-locks.qmd
    - Courses/03_distributed.qmd
    - Courses/04_simd.qmd
    - Courses/05_gpu.qmd
    - Courses/06_webgpu.qmd
    - projects.qmd
    - summary.qmd
    - references.qmd

  appendices:
    - appendix-local-llm.qmd
    - appendix-slides.qmd
    - appendix-llm-docs.qmd

bibliography: references.bib
csl: ieee.csl

fig-cap-location: top

execute:
  freeze: auto
  cache: true

theme:
  dark: [darkly, styles.scss]
  light: [flatly, styles.scss]

format:
  html:
    number-depth: 3
    toc-depth: 4
    html-math-method: katex
    respect-user-color-scheme: true
